
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oranos Stidyo - سينما أورانوس</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        header h1 {
            font-size: 26px;
            color: #38bdf8;
            margin-bottom: 5px;
        }
        header p {
            color: #94a3b8;
            font-size: 14px;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        video {
            width: 100%;
            height: auto;
            display: block;
            outline: none;
        }
        footer {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🎬 Oranos Stidyo</h1>
            <p>منصة العرض السينمائي الخاصة بك</p>
        </header>

        <div class="video-wrapper">
            <!-- استبدل "ملف_الفيديو.mp4" باسم الفيديو الذي رفعته تماماً -->
            <video controls poster="">
                <source src="ملف_الفيديو.mp4" type="video/mp4">
                متصفحك لا يدعم تشغيل فيديو HTML5.
            </video>
        </div>

        <footer>
            تم التطوير بواسطة Oranos Dev &copy; 2026
        </footer>
    </div>

</body>
</html>
